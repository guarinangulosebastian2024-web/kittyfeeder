<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  color:white;
  text-align:center;

  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
    url("logo.png");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.app{
  max-width:400px;
  margin:auto;
  padding:20px;
}

.card{
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-radius:20px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

h1{
  margin-bottom:20px;
}

.mascotas{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px 0;
}

.mascotas img{
  width:80px;
  height:80px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #22c55e;
  box-shadow:0 0 15px #22c55e;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  font-weight:bold;
  cursor:pointer;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  box-shadow:0 0 15px #22c55e;
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

#cam img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

.estado-ok{color:#22c55e;}
.estado-wait{color:#facc15;}
.estado-off{color:red;}
</style>
</head>

<body>

<div class="app">

<h1>🤖 A.G ROBOTICS</h1>

<div class="mascotas">
  <img src="kitty.png">
  <img src="fiona.png">
</div>

<!-- HORA -->
<div class="card">
  <h2>⏰ Hora</h2>
  <p id="hora"></p>
</div>

<!-- SENSOR -->
<div class="card">
  <h2>📡 Estado</h2>
  <p id="estado" class="estado-wait">Esperando...</p>
</div>

<!-- MANUAL -->
<div class="card">
  <h2>🎮 Manual</h2>
  <button id="btnManual">Servir comida (mantener)</button>
</div>

<!-- INTELIGENTE -->
<div class="card">
  <h2>🧠 Inteligente</h2>

  <select id="peso"></select>
  <select id="raciones"></select>

  <button id="btnSmart">Servir inteligente</button>

  <p id="calc"></p>
</div>

<!-- CAMARA -->
<div class="card">
  <h2>📷 Cámara</h2>
  <button id="btnCam">Ver cámara</button>
  <div id="cam"></div>
</div>

</div>

<script>

// CONFIG
let BASE = "http://192.168.0.25";
let CAM  = "http://192.168.0.24";

// SELECTS
let pesoSelect = document.getElementById("peso");
for(let i=1;i<=20;i++){
  let o=document.createElement("option");
  o.value=i;
  o.text=i+" kg";
  pesoSelect.appendChild(o);
}

let racionesSelect = document.getElementById("raciones");
for(let i=1;i<=8;i++){
  let o=document.createElement("option");
  o.value=i;
  o.text=i+" ración(es)";
  racionesSelect.appendChild(o);
}

// RELOJ
function actualizarHora(){
  let h=document.getElementById("hora");
  let a=new Date();

  let hr=a.getHours();
  let m=a.getMinutes();
  let s=a.getSeconds();

  let ampm=hr>=12?"PM":"AM";
  hr=hr%12||12;

  h.innerText =
    hr+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2)+" "+ampm;
}
setInterval(actualizarHora,1000);

// MANUAL (IMPORTANTE)
let btnManual = document.getElementById("btnManual");
let intervaloServo;

btnManual.onmousedown=()=>{
  fetch(BASE+"/servo");
  intervaloServo=setInterval(()=>{
    fetch(BASE+"/servo");
  },300);
};

btnManual.onmouseup=()=>{
  clearInterval(intervaloServo);
};

btnManual.onmouseleave=()=>{
  clearInterval(intervaloServo);
};

// INTELIGENTE
document.getElementById("btnSmart").onclick=()=>{

  let peso=parseInt(pesoSelect.value);
  let raciones=parseInt(racionesSelect.value);

  let gramos=peso*30;
  let porcion=gramos/raciones;
  let tiempo=porcion/50;

  document.getElementById("calc").innerText =
    "Por ración: "+porcion.toFixed(0)+" g";

  fetch(BASE+"/smart?time="+tiempo);
};

// SENSOR (🔥 ESTE ERA EL QUE TE FALTABA)
setInterval(()=>{

  fetch(BASE+"/")
  .then(r=>r.text())
  .then(d=>{
    let estado=document.getElementById("estado");

    if(d.trim()=="1"){
      estado.innerText="🐱 Mascota detectada";
      estado.className="estado-ok";
    }else{
      estado.innerText="Esperando...";
      estado.className="estado-wait";
    }
  })
  .catch(()=>{
    let estado=document.getElementById("estado");
    estado.innerText="🔴 Sin conexión";
    estado.className="estado-off";
  });

},1500);

// CAMARA
let activa=false;
let intervalo;

document.getElementById("btnCam").onclick=()=>{
  let div=document.getElementById("cam");

  if(!activa){
    div.innerHTML='<img id="stream">';
    let img=document.getElementById("stream");

    intervalo=setInterval(()=>{
      img.src=CAM+"/?t="+Date.now();
    },300);

    activa=true;
  }else{
    clearInterval(intervalo);
    div.innerHTML="";
    activa=false;
  }
};

</script>

</body>
</html>
