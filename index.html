<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KittyFeeder PRO</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

.section{
  background:#1e293b;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  max-width:400px;
}

button, input{
  width:80%;
  padding:12px;
  margin:8px;
  border:none;
  border-radius:10px;
}

.blue{ background:#06b6d4; }
.green{ background:#22c55e; }
.red{ background:#ef4444; }

label{
  display:block;
  margin-top:10px;
}
</style>

</head>

<body>

<h1>🐱 KittyFeeder PRO</h1>

<!-- 🔵 MANUAL -->
<div class="section">
<h2>Modo Manual</h2>

<button class="blue"
onmousedown="servir()"
onmouseup="detener()"
ontouchstart="servir()"
ontouchend="detener()">
MANTENER PARA SERVIR
</button>

</div>

<!-- 🧠 INTELIGENTE -->
<div class="section">
<h2>Modo Inteligente</h2>

<button class="blue" onclick="inteligente()">
SERVIR AUTOMÁTICO
</button>

<label>Peso (kg)</label>
<input type="number" id="peso" min="1" max="15" value="5">

<label>Comidas por día</label>
<input type="number" id="comidas" min="1" max="6" value="2">

<button onclick="guardarConfig()">Guardar configuración</button>

</div>

<!-- ⏰ HORARIO -->
<div class="section">
<h2>Programar comida</h2>

<input type="number" id="hora" min="0" max="23" placeholder="Hora">
<input type="number" id="minuto" min="0" max="59" placeholder="Minuto">

<button onclick="guardarHora()">Guardar horario</button>

</div>

<!-- 📷 CÁMARA -->
<div class="section">
<h2>Cámara</h2>

<button class="green" onclick="verCamara()">Ver cámara</button>
<button class="red" onclick="ocultarCamara()">Cerrar cámara</button>

</div>

<script>

const token = "rENj_cpRbyDzJjYU6ZxKDegh8J0xxbtP";
const CAM_URL = "http://192.168.0.24";

// 🔥 función base
function enviar(url){
  fetch(url)
  .then(function(res){ return res.text(); })
  .then(function(data){ console.log("OK:", data); })
  .catch(function(err){ console.log("ERROR:", err); });
}

// 🔵 MANUAL
function servir(){
  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V0=1");
}

function detener(){
  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V0=0");
}

// 🧠 INTELIGENTE
function inteligente(){
  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V2=1");
}

// ⚙️ CONFIG
function guardarConfig(){
  var peso = document.getElementById("peso").value;
  var comidas = document.getElementById("comidas").value;

  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V10=" + peso);
  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V4=" + comidas);

  alert("Configuración guardada");
}

// ⏰ HORARIO
function guardarHora(){
  var h = document.getElementById("hora").value;
  var m = document.getElementById("minuto").value;

  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V1=" + h);
  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V5=" + m);

  alert("Horario guardado");
}

// 📷 CÁMARA
function verCamara(){
  window.open(CAM_URL, "_blank");

  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V6=1");
}

function ocultarCamara(){
  enviar("https://blynk.cloud/external/api/update?token=" + token + "&V6=0");
}

</script>

</body>
</html>
