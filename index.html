<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

/* 🔥 FONDO FULL LOGO */
body{
  color:white;
  text-align:center;

  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
    url("logo.png");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* 📱 CONTENEDOR TIPO APP */
.app{
  max-width:400px;
  margin:auto;
  padding:20px;
}

/* 💎 CARDS GLASS */
.card{
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-radius:20px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

/* 🤖 TITULO */
h1{
  margin-bottom:20px;
  font-size:28px;
}

/* 🐱 MASCOTAS */
.mascotas{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:20px 0;
}

.mascotas img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #22c55e;

  box-shadow:
    0 0 10px rgba(34,197,94,0.6),
    0 0 20px rgba(34,197,94,0.4);

  transition:0.3s;
}

.mascotas img:hover{
  transform:scale(1.15);
  box-shadow:
    0 0 25px #22c55e,
    0 0 50px #22c55e;
}

/* 🟢 BOTONES */
button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;

  background: linear-gradient(135deg,#22c55e,#16a34a);

  box-shadow:
    0 0 10px #22c55e,
    0 0 20px rgba(34,197,94,0.5);

  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:
    0 0 20px #22c55e,
    0 0 40px #22c55e;
}

/* INPUTS */
input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

/* 📷 CAMARA */
#cam img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<h1>🤖 A.G ROBOTICS</h1>

<!-- 🐱 MASCOTAS -->
<div class="mascotas">
  <img src="kitty.png">
  <img src="fiona.png">
</div>

<!-- ⏰ HORA -->
<div class="card">
  <h2>⏰ Hora</h2>
  <p id="hora"></p>
</div>

<!-- 🎮 MANUAL -->
<div class="card">
  <h2>🎮 Manual</h2>
  <button id="btnManual">Servir comida</button>
</div>

<!-- 🧠 INTELIGENTE -->
<div class="card">
  <h2>🧠 Inteligente</h2>

  <select id="peso"></select>
  <select id="raciones"></select>

  <button id="btnSmart">Servir inteligente</button>

  <p id="calc"></p>
</div>

<!-- 📷 CAMARA -->
<div class="card">
  <h2>📷 Cámara</h2>
  <button id="btnCam">Ver cámara</button>
  <div id="cam"></div>
</div>

</div>

<script>

// CONFIG
let BASE = "http://192.168.0.25";
let CAM  = "http://192.168.0.24";

// SELECTS
let pesoSelect = document.getElementById("peso");
for(let i=1;i<=20;i++){
  let o=document.createElement("option");
  o.value=i;
  o.text=i+" kg";
  pesoSelect.appendChild(o);
}

let racionesSelect = document.getElementById("raciones");
for(let i=1;i<=8;i++){
  let o=document.createElement("option");
  o.value=i;
  o.text=i+" ración(es)";
  racionesSelect.appendChild(o);
}

// RELOJ
function actualizarHora(){
  let h=document.getElementById("hora");
  if(!h) return;

  let a=new Date();
  let hr=a.getHours();
  let m=a.getMinutes();
  let s=a.getSeconds();

  let ampm=hr>=12?"PM":"AM";
  hr=hr%12||12;

  h.innerText=
    hr+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2)+" "+ampm;
}
setInterval(actualizarHora,1000);

// CAMARA
let activa=false;
let intervalo;

document.getElementById("btnCam").onclick=()=>{
  let div=document.getElementById("cam");

  if(!activa){
    div.innerHTML='<img id="stream">';
    let img=document.getElementById("stream");

    intervalo=setInterval(()=>{
      img.src=CAM+"/?t="+Date.now();
    },300);

    activa=true;
  }else{
    clearInterval(intervalo);
    div.innerHTML="";
    activa=false;
  }
};

</script>

</body>
</html>
