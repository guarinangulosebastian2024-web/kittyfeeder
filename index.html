<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Feeder PRO</title>

<style>

/* 🔥 RESET PARA APP */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* 🔥 FONDO CON LOGO */
body{
  font-family: Arial;
  color:white;
  text-align:center;

  background: url("logo.png") no-repeat center center fixed;
  background-size: cover;
}

/* 🔥 CAPA OSCURA PARA LEGIBILIDAD */
.overlay{
  background: rgba(0,0,0,0.7);
  min-height:100vh;
  padding:20px;
}

/* 🔥 TITULO */
h1{
  font-size:28px;
  margin-bottom:20px;
  letter-spacing:2px;
}

/* 🔥 CARDS */
.card{
  background: rgba(30,41,59,0.85);
  backdrop-filter: blur(10px);

  margin:15px auto;
  padding:20px;

  border-radius:20px;
  width:95%;
  max-width:400px;

  box-shadow:0 0 20px rgba(0,255,200,0.2);
}

/* 🔥 BOTONES */
button{
  width:100%;
  padding:15px;
  margin-top:10px;

  border:none;
  border-radius:15px;

  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;

  font-size:16px;
  font-weight:bold;

  cursor:pointer;
}

/* 🔥 INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:10px;

  border-radius:10px;
  border:none;

  font-size:16px;
}

/* 🔥 TEXTO */
p{
  margin-top:10px;
  font-size:16px;
}

/* 🔥 CAMARA */
#cam img{
  border-radius:15px;
  margin-top:10px;
}

/* 🔥 ESTADO */
.estado-ok{
  color:#22c55e;
  font-weight:bold;
}

.estado-wait{
  color:#facc15;
}

.estado-off{
  color:red;
}

</style>
</head>

<body>

<div class="overlay">

<h1>🤖 A.G ROBOTICS</h1>

<!-- ⏰ HORA -->
<div class="card">
<h2>⏰ Hora en vivo</h2>
<p id="hora"></p>
</div>

<!-- 🎮 MANUAL -->
<div class="card">
<h2>🍽 Alimentar</h2>
<button onclick="servir()">Servir comida</button>
</div>

<!-- ⏰ PROGRAMAR -->
<div class="card">
<h2>⏰ Programar comida</h2>
<input type="time" id="horaProg">
<button onclick="programar()">Guardar</button>
<p id="msg"></p>
</div>

<!-- 📷 CAMARA -->
<div class="card">
<h2>📷 Cámara en vivo</h2>
<button onclick="camara()">Ver cámara</button>
<div id="cam"></div>
</div>

<!-- 📡 ESTADO -->
<div class="card">
<h2>📡 Estado</h2>
<p id="estado" class="estado-wait">Esperando...</p>
</div>

</div>

<script>

const BASE = "http://192.168.0.25";
const CAM  = "http://192.168.0.24";

let activa = false;

// ⏰ RELOJ
function actualizarHora(){

  let ahora = new Date();

  let h = ahora.getHours();
  let m = ahora.getMinutes();
  let s = ahora.getSeconds();

  let ampm = h >= 12 ? "PM" : "AM";

  h = h % 12;
  if(h == 0) h = 12;

  document.getElementById("hora").innerText =
    h + ":" +
    ("0"+m).slice(-2) + ":" +
    ("0"+s).slice(-2) + " " + ampm;
}

setInterval(actualizarHora,1000);
actualizarHora();

// 🍽 SERVIR
function servir(){
  fetch(BASE + "/servo");
}

// 📷 CAMARA
function camara(){

  let div = document.getElementById("cam");

  if(!activa){

    div.innerHTML = '<img src="'+CAM+'" width="100%">';
    activa = true;

    fetch(BASE + "/cam");

  }else{

    div.innerHTML = "";
    activa = false;
  }
}

// ⏰ PROGRAMAR (FIX)
function programar(){

  let horaCompleta = document.getElementById("horaProg").value;

  if(!horaCompleta){
    alert("Selecciona una hora");
    return;
  }

  let hora = horaCompleta.substring(0,5);

  fetch(BASE + "/sethora?hora=" + hora);

  document.getElementById("msg").innerText =
    "Programado a: " + hora;
}

// 📡 SENSOR
setInterval(()=>{

  fetch(BASE + "/")
  .then(r => r.text())
  .then(d => {

    let estado = document.getElementById("estado");

    if(d.trim()=="1"){
      estado.innerText = "🐱 Kitty detectada";
      estado.className = "estado-ok";
    }else{
      estado.innerText = "Esperando...";
      estado.className = "estado-wait";
    }

  })
  .catch(()=>{
    let estado = document.getElementById("estado");
    estado.innerText = "🔴 Sin conexión";
    estado.className = "estado-off";
  });

},1500);

</script>

</body>
</html>
