<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KittyFeeder Elite</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:sans-serif;
  text-align:center;
}

.section{
  background:#1e293b;
  margin:20px auto;
  padding:20px;
  border-radius:20px;
  max-width:400px;
}

button{
  width:100%;
  padding:15px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}

.blue{ background:#06b6d4; }
.green{ background:#22c55e; }

select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🐱 KittyFeeder Elite</h1>

<!-- 🔵 MODO MANUAL -->
<div class="section">
<h2>Modo Manual</h2>

<button class="blue"
onmousedown="startManual()"
onmouseup="stopManual()"
ontouchstart="startManual()"
ontouchend="stopManual()">
MANTENER PARA SERVIR
</button>

</div>

<!-- 🧠 MODO INTELIGENTE -->
<div class="section">
<h2>Modo Inteligente</h2>

<select id="peso"></select>
<select id="comidas"></select>

<button class="blue" onclick="servirInteligente()">
SERVIR AUTOMÁTICO
</button>

</div>

<!-- ⏰ PROGRAMACIÓN -->
<div class="section">
<h2>Programar Comida</h2>

<select id="hora"></select>
<select id="minuto"></select>

<button class="green" onclick="guardarHorario()">
GUARDAR HORARIO
</button>

</div>

<!-- 📷 CÁMARA -->
<div class="section">
<h2>Cámara</h2>

<button class="blue" onclick="verCamara()">Ver cámara</button>
<button class="blue" onclick="ocultarCamara()">Ocultar cámara</button>

<div id="camara" style="display:none;">
<iframe id="frameCam" width="100%" height="200"></iframe>
</div>

</div>

<script>

// 🔥 CONFIGURACIÓN (TUYA)
const token = "rENj_cpRbyDzJjYU6ZxKDegh8J0xxbtP";
const CAM_URL = "https://calendrical-delores-unforensic.ngrok-free.dev";

// 🔥 FUNCIÓN BASE
function enviar(pin, valor){
  fetch(https://blynk.cloud/external/api/update?token=${token}&${pin}=${valor})
  .then(res => res.text())
  .then(data => console.log("OK:", data))
  .catch(err => console.error("ERROR:", err));
}

// 🔵 MODO MANUAL
function startManual(){
  enviar("V0",1);
}

function stopManual(){
  enviar("V0",0);
}

// 🧠 MODO INTELIGENTE
function servirInteligente(){

  const peso = document.getElementById("peso").value;
  const comidas = document.getElementById("comidas").value;

  enviar("V10", peso);
  enviar("V4", comidas);

  setTimeout(()=>{
    enviar("V2",1);
  },500);
}

// ⏰ PROGRAMAR
function guardarHorario(){

  const h = document.getElementById("hora").value;
  const m = document.getElementById("minuto").value;

  enviar("V1",h);
  enviar("V5",m);

  alert("Horario guardado");
}

// 📷 CÁMARA
function verCamara(){

  document.getElementById("camara").style.display="block";
  document.getElementById("frameCam").src = CAM_URL;

  enviar("V6",1); // micro comida
}

function ocultarCamara(){

  document.getElementById("camara").style.display="none";
  document.getElementById("frameCam").src = "";

  enviar("V6",0);
}

// 🔥 LLENAR DATOS AUTOMÁTICO

// Peso 1–15 kg
for(let i=1;i<=15;i++){
  let opt = document.createElement("option");
  opt.value = i;
  opt.text = i + " kg";
  document.getElementById("peso").appendChild(opt);
}

// Comidas 1–6
for(let i=1;i<=6;i++){
  let opt = document.createElement("option");
  opt.value = i;
  opt.text = i + " comidas";
  document.getElementById("comidas").appendChild(opt);
}

// Horas 0–23
for(let i=0;i<24;i++){
  let opt = document.createElement("option");
  opt.value = i;
  opt.text = (i<10?"0":"")+i;
  document.getElementById("hora").appendChild(opt);
}

// Minutos 0–59
for(let i=0;i<60;i++){
  let opt = document.createElement("option");
  opt.value = i;
  opt.text = (i<10?"0":"")+i;
  document.getElementById("minuto").appendChild(opt);
}

</script>

</body>
</html>
