<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
.card{
  background:#1e293b;
  margin:15px;
  padding:20px;
  border-radius:20px;
}
button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
}
</style>
</head>

<body>

<h1>🐱 Smart Feeder PRO</h1>

<div class="card">
<h3>Hora</h3>
<p id="hora"></p>
</div>

<div class="card">
<h3>Manual</h3>
<button id="btn">Servir</button>
</div>

<div class="card">
<h3>Peso</h3>
<input type="range" min="1" max="15" id="peso">
<p id="pesoVal"></p>

<h3>Comidas</h3>
<select id="comidas">
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option>
</select>

<button onclick="guardar()">Guardar</button>
</div>

<div class="card">
<h3>Estado</h3>
<p id="estado"></p>
</div>

<div class="card">
<h3>Historial</h3>
<div id="historial"></div>
</div>

<script>

let BASE = "http://192.168.0.25";

// RELOJ
setInterval(()=>{
let d=new Date();
document.getElementById("hora").innerText=d.toLocaleTimeString();
},1000);

// MANUAL
let btn=document.getElementById("btn");

btn.onmousedown=()=>fetch(BASE+"/manual?state=1");
btn.onmouseup=()=>fetch(BASE+"/manual?state=0");

// GUARDAR
function guardar(){
let p=document.getElementById("peso").value;
let c=document.getElementById("comidas").value;

fetch(BASE+"/config?peso="+p+"&comidas="+c+"&modo=auto");
}

// SENSOR
setInterval(()=>{
fetch(BASE+"/")
.then(r=>r.text())
.then(d=>{
document.getElementById("estado").innerText =
(d=="1")?"🐱 Detectado":"Esperando";
});
},1000);

// HISTORIAL
function cargarHistorial(){
fetch("https://smart-feeder-kitty-default-rtdb.firebaseio.com/historial.json")
.then(r=>r.json())
.then(data=>{
let div=document.getElementById("historial");
div.innerHTML="";
for(let k in data){
let p=document.createElement("p");
p.innerText=data[k];
div.appendChild(p);
}
});
}
setInterval(cargarHistorial,3000);

</script>

</body>
</html>
