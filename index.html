<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  color:white;
  text-align:center;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
    url("logo.png");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.app{max-width:400px;margin:auto;padding:20px;}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.mascotas{
  display:flex;justify-content:center;gap:20px;margin:20px 0;
}

.mascotas img{
  width:85px;height:85px;border-radius:50%;
  object-fit:cover;border:3px solid #22c55e;
  box-shadow:0 0 20px #22c55e;
}

button{
  width:100%;padding:15px;margin-top:10px;
  border:none;border-radius:15px;font-weight:bold;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  box-shadow:0 0 15px #22c55e;
  cursor:pointer;
}

input,select{
  width:100%;padding:12px;margin-top:10px;
  border-radius:10px;border:none;
}

.estado-ok{color:#22c55e;}
.estado-wait{color:#facc15;}
.estado-off{color:red;}
</style>
</head>

<body>

<div class="app">

<h1>🤖 A.G ROBOTICS</h1>

<div class="mascotas">
  <img src="kitty.png">
  <img src="fiona.png">
</div>

<!-- HORA -->
<div class="card">
  <h2>⏰ Hora</h2>
  <p id="hora"></p>
</div>

<!-- ESTADO -->
<div class="card">
  <h2>📡 Estado</h2>
  <p id="estado" class="estado-wait">Esperando...</p>
</div>

<!-- MANUAL -->
<div class="card">
  <h2>🎮 Manual</h2>
  <button id="btnManual">Servir comida (mantener)</button>
</div>

<!-- INTELIGENTE -->
<div class="card">
  <h2>🧠 Inteligente</h2>
  <select id="peso"></select>
  <select id="raciones"></select>
  <button id="btnSmart">Servir inteligente</button>
  <p id="calc"></p>
</div>

<!-- PROGRAMAR -->
<div class="card">
  <h2>⏰ Programar comida</h2>
  <input type="time" id="horaProg">
  <button id="btnProg">Guardar horario</button>

  <!-- 🔥 AQUÍ SIEMPRE SALE -->
  <p id="proxima">🕒 Próxima comida: --:--</p>
</div>

<!-- CAMARA -->
<div class="card">
  <h2>📷 Cámara</h2>
  <button id="btnCam">Ver cámara</button>
  <div id="cam"></div>
</div>

</div>

<script>

/* AUTO DETECTA */
let BASE, CAM;

if(location.hostname==="localhost"||location.hostname==="127.0.0.1"){
  BASE="http://192.168.0.25";
  CAM="http://192.168.0.24";
}else{
  BASE="https://calendrical-delores-unforensic.ngrok-free.dev";
  CAM=BASE;
}

/* SELECTS */
let peso=document.getElementById("peso");
for(let i=1;i<=20;i++){
  let o=document.createElement("option");
  o.value=i;o.text=i+" kg";
  peso.appendChild(o);
}

let raciones=document.getElementById("raciones");
for(let i=1;i<=8;i++){
  let o=document.createElement("option");
  o.value=i;o.text=i+" ración(es)";
  raciones.appendChild(o);
}

/* RELOJ */
function actualizarHora(){
  let h=document.getElementById("hora");
  let a=new Date();
  let hr=a.getHours(),m=a.getMinutes(),s=a.getSeconds();
  let ampm=hr>=12?"PM":"AM";
  hr=hr%12||12;
  h.innerText=hr+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2)+" "+ampm;
}
setInterval(actualizarHora,1000);

/* MANUAL */
let intServo;
btnManual.onmousedown=()=>{
  fetch(BASE+"/servo");
  intServo=setInterval(()=>fetch(BASE+"/servo"),300);
};
btnManual.onmouseup=()=>clearInterval(intServo);
btnManual.onmouseleave=()=>clearInterval(intServo);

/* INTELIGENTE */
btnSmart.onclick=()=>{
  let p=parseInt(peso.value);
  let r=parseInt(raciones.value);

  let g=p*30;
  let por=g/r;
  let t=por/50;

  calc.innerText="Por ración: "+por.toFixed(0)+" g";
  fetch(BASE+"/smart?time="+t);
};

/* PROGRAMAR (🔥 CORREGIDO BIEN) */
let proxima=document.getElementById("proxima");

// cargar guardado
let guardado=localStorage.getItem("horaComida");
if(guardado){
  proxima.innerText="🕒 Próxima comida: "+guardado;
}

btnProg.onclick=()=>{
  let hora=horaProg.value;

  if(!hora){
    alert("Selecciona una hora");
    return;
  }

  // guardar local SIEMPRE
  localStorage.setItem("horaComida",hora);
  proxima.innerText="🕒 Próxima comida: "+hora;

  // enviar al ESP32 (si existe)
  fetch(BASE+"/sethora?hora="+hora).catch(()=>{});
};

/* SENSOR */
setInterval(()=>{
  fetch(BASE+"/")
  .then(r=>r.text())
  .then(d=>{
    if(d.trim()=="1"){
      estado.innerText="🐱 Detectado";
      estado.className="estado-ok";
    }else{
      estado.innerText="Esperando...";
      estado.className="estado-wait";
    }
  })
  .catch(()=>{
    estado.innerText="🔴 Sin conexión";
    estado.className="estado-off";
  });
},1500);

/* CAMARA */
let activa=false,intCam;
btnCam.onclick=()=>{
  if(!activa){
    cam.innerHTML='<img id="stream">';
    let img=document.getElementById("stream");
    intCam=setInterval(()=>img.src=CAM+"/?t="+Date.now(),300);
    activa=true;
  }else{
    clearInterval(intCam);
    cam.innerHTML="";
    activa=false;
  }
};

</script>

</body>
</html>
