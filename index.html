<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>KittyFeeder PRO</title>

<style>
body{
  background:#0f172a;
  color:white;
  font-family:'Segoe UI', sans-serif;
  text-align:center;
  margin:0;
}

h1{
  font-size:22px;
  margin:10px;
}

.clock{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin:10px auto;
  width:80%;
  max-width:300px;
  border:2px solid #22c55e;
}

.section{
  background:#1e293b;
  margin:15px;
  padding:15px;
  border-radius:15px;
}

button, select{
  width:95%;
  padding:14px;
  margin:6px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

button:active{
  transform: scale(0.97);
}

.blue{ background:#06b6d4; }
.green{ background:#22c55e; }
.yellow{ background:#facc15; color:black; }

#cam{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>🤖 KittyFeeder PRO</h1>

<div class="clock" id="horaActual"></div>

<!-- MANUAL -->
<div class="section">
<h2>Modo Manual</h2>
<button class="blue" onclick="toggleManual()">SERVIR / DETENER</button>
</div>

<!-- INTELIGENTE -->
<div class="section">
<h2>Modo Inteligente</h2>

<button class="blue" onclick="inteligente()">SERVIR AUTOMÁTICO</button>

<select id="peso"></select>
<select id="comidas"></select>

<button class="yellow" onclick="guardarConfig()">Guardar configuración</button>

<div id="resultado"></div>
</div>

<!-- HORARIO -->
<div class="section">
<h2>Programar comida</h2>

<select id="hora"></select>
<select id="minuto"></select>

<button class="green" onclick="guardarHora()">Guardar horario</button>

<div id="horario"></div>
</div>

<!-- CAMARA -->
<div class="section">
<h2>Cámara</h2>

<button class="green" onclick="activarCam()">Activar cámara</button>

<img id="cam" style="display:none;">
</div>

<script>

let token = "rENj_cpRbyDzJjYU6ZxKDegh8J0xxbtP";
let estadoServo = 0;

// reloj
setInterval(()=>{
  document.getElementById("horaActual").innerHTML =
    new Date().toLocaleTimeString();
},1000);

// enviar datos
function enviar(url){
  fetch(url).catch(e=>console.log("Error:", e));
}

// MANUAL (toggle)
function toggleManual(){
  estadoServo = estadoServo === 0 ? 1 : 0;

  enviar("https://blynk.cloud/external/api/update?token="+token+"&V0="+estadoServo);
}

// INTELIGENTE
function inteligente(){
  enviar("https://blynk.cloud/external/api/update?token="+token+"&V2=1");
}

// CONFIG
function guardarConfig(){
  let pesoVal = parseInt(document.getElementById("peso").value);
  let comidasVal = parseInt(document.getElementById("comidas").value);

  let gramos = pesoVal * 40;
  let porcion = Math.round(gramos / comidasVal);

  document.getElementById("resultado").innerHTML =
    "🍽 " + porcion + " g por comida";

  enviar("https://blynk.cloud/external/api/update?token="+token+"&V10="+porcion);
}

// HORARIO
function guardarHora(){
  let h = parseInt(document.getElementById("hora").value);
  let m = parseInt(document.getElementById("minuto").value);

  enviar("https://blynk.cloud/external/api/update?token="+token+"&V1="+h);
  enviar("https://blynk.cloud/external/api/update?token="+token+"&V5="+m);

  document.getElementById("horario").innerHTML =
    "⏰ " + h + ":" + (m < 10 ? "0"+m : m);
}

// CAMARA (estable)
function activarCam(){
  let cam = document.getElementById("cam");

  cam.src = "http://192.168.0.24"; // CAMBIA SI NECESITAS

  cam.style.display = "block";
}

// OPCIONES
for(let i=1;i<=15;i++){
  document.getElementById("peso").innerHTML += "<option value='"+i+"'>"+i+" kg</option>";
}

for(let i=1;i<=6;i++){
  document.getElementById("comidas").innerHTML += "<option value='"+i+"'>"+i+" comidas</option>";
}

for(let i=0;i<24;i++){
  document.getElementById("hora").innerHTML += "<option value='"+i+"'>"+i+"</option>";
}

for(let i=0;i<60;i++){
  let val = i < 10 ? "0"+i : i;
  document.getElementById("minuto").innerHTML += "<option value='"+i+"'>"+val+"</option>";
}

</script>

</body>
</html>
