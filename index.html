<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Feeder</title>

<style>
body{
  background:#0f172a;
  color:white;
  text-align:center;
  font-family:Arial;
}

button{
  padding:20px;
  font-size:20px;
  border:none;
  border-radius:10px;
  background:#22c55e;
  color:white;
}
</style>

</head>

<body>

<h1>🐱 Smart Feeder</h1>

<button id="btnFeed">
Mantener para servir comida
</button>

<script>

const IP = "192.168.0.20";

// 🔥 FUNCIONES
function manualOn(){
  fetch("http://" + IP + "/manual?state=1")
  .then(()=>console.log("ON"))
  .catch(err=>console.log(err));
}

function manualOff(){
  fetch("http://" + IP + "/manual?state=0")
  .then(()=>console.log("OFF"))
  .catch(err=>console.log(err));
}

// 🔥 EVENTOS (ESTO ES LA CLAVE)
document.addEventListener("DOMContentLoaded", ()=>{

  const btn = document.getElementById("btnFeed");

  btn.addEventListener("mousedown", manualOn);
  btn.addEventListener("mouseup", manualOff);

  // para celular
  btn.addEventListener("touchstart", manualOn);
  btn.addEventListener("touchend", manualOff);

});

</script>

</body>
</html>
