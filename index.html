<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  color:white;
  text-align:center;
  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.9)),
    url("logo.png");
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

.app{max-width:400px;margin:auto;padding:20px;}

.card{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:20px;
  margin:15px 0;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

button{
  width:100%;padding:15px;margin-top:10px;
  border:none;border-radius:15px;font-weight:bold;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  cursor:pointer;
}

input,select{
  width:100%;padding:12px;margin-top:10px;
  border-radius:10px;border:none;
}

.estado-ok{color:#22c55e;}
.estado-wait{color:#facc15;}
.estado-off{color:red;}

#cam img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<h1>🤖 A.G ROBOTICS</h1>

<div class="card">
  <h2>⏰ Hora</h2>
  <p id="hora"></p>
</div>

<div class="card">
  <h2>📡 Estado</h2>
  <p id="estado" class="estado-wait">Esperando...</p>
</div>

<div class="card">
  <h2>🎮 Manual</h2>
  <button id="btnManual">Servir comida</button>
</div>

<div class="card">
  <h2>📷 Cámara</h2>
  <button id="btnCam">Ver cámara</button>
  <div id="cam"></div>
</div>

</div>

<script>

// ✅ IPS CORRECTAS
let BASE = "http://192.168.0.20"; // ESP32 servo
let CAM  = "http://192.168.0.21"; // ESP32-CAM

// RELOJ
function actualizarHora(){
  let a=new Date();
  let hr=a.getHours(),m=a.getMinutes(),s=a.getSeconds();
  let ampm=hr>=12?"PM":"AM";
  hr=hr%12||12;
  document.getElementById("hora").innerText=
  hr+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2)+" "+ampm;
}
setInterval(actualizarHora,1000);

// SERVIR
document.getElementById("btnManual").onclick=()=>{
  fetch(BASE+"/servo");
};

// SENSOR
setInterval(()=>{
  fetch(BASE+"/")
  .then(r=>r.text())
  .then(d=>{
    let estado=document.getElementById("estado");
    if(d.trim()=="1"){
      estado.innerText="🐱 Detectado";
      estado.className="estado-ok";
    }else{
      estado.innerText="Esperando...";
      estado.className="estado-wait";
    }
  })
  .catch(()=>{
    let estado=document.getElementById("estado");
    estado.innerText="🔴 Sin conexión";
    estado.className="estado-off";
  });
},1500);

// 🎥 CAMARA (CORREGIDA)
let activa=false;
let intervaloCam;

document.getElementById("btnCam").onclick=()=>{

  let camDiv=document.getElementById("cam");

  if(!activa){

    camDiv.innerHTML='<img id="stream">';
    let img=document.getElementById("stream");

    intervaloCam=setInterval(()=>{
      img.src = CAM + "/?t=" + new Date().getTime();
    }, 400); // 🔥 más estable

    activa=true;

  }else{

    clearInterval(intervaloCam);
    camDiv.innerHTML="";
    activa=false;

  }
};

</script>

</body>
</html>
