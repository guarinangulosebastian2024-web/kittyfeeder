<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Control de Alimentador</title>
    <style>
        body { background: #1e293b; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .btn {
            background: #22c55e; border: none; padding: 40px 60px; color: white;
            font-size: 24px; border-radius: 20px; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); touch-action: manipulation;
        }
        .btn:active { background: #16a34a; transform: scale(0.98); }
        .info { margin-top: 20px; color: #94a3b8; }
    </style>
</head>
<body>

    <h1>🐱 Control Manual</h1>
    
    <button id="btnFeed" class="btn">MANTENER PARA SERVIR</button>
    
    <div class="info">Conectado a: <span id="ip">192.168.0.20</span></div>

    <script>
        const IP = "192.168.0.20";
        const btn = document.getElementById("btnFeed");

        // Esta función envía la señal al ESP32
        function enviarComando(estado) {
            // mode: 'no-cors' evita el error de seguridad del navegador
            fetch(http://${IP}/manual?state=${estado}, { mode: 'no-cors' })
            .then(() => console.log("Enviado: " + estado))
            .catch(e => console.error("Error:", e));
        }

        // Eventos para PC
        btn.addEventListener("mousedown", () => enviarComando(1));
        btn.addEventListener("mouseup", () => enviarComando(0));
        btn.addEventListener("mouseleave", () => enviarComando(0));

        // Eventos para Celular
        btn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            enviarComando(1);
        });
        btn.addEventListener("touchend", (e) => {
            e.preventDefault();
            enviarComando(0);
        });
    </script>
</body>
</html>
