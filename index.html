<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Feeder PRO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body{
  font-family: Arial;
  color:white;
  text-align:center;
  background: url("logo.png") no-repeat center center fixed;
  background-size: cover;
}

.overlay{
  background: rgba(0,0,0,0.7);
  min-height:100vh;
  padding:20px;
}

h1{
  font-size:28px;
  margin-bottom:20px;
}

.card{
  background: rgba(30,41,59,0.85);
  backdrop-filter: blur(10px);
  margin:15px auto;
  padding:20px;
  border-radius:20px;
  width:95%;
  max-width:400px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-size:16px;
  font-weight:bold;
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

p{
  margin-top:10px;
}

#cam img{
  border-radius:15px;
  margin-top:10px;
}

.estado-ok{color:#22c55e;}
.estado-wait{color:#facc15;}
.estado-off{color:red;}
</style>
</head>

<body>

<div class="overlay">

<h1>🤖 A.G ROBOTICS</h1>

<!-- ⏰ HORA -->
<div class="card">
<h2>⏰ Hora en vivo</h2>
<p id="hora"></p>
</div>

<!-- 🎮 MODO MANUAL -->
<div class="card">
<h2>🎮 Modo Manual</h2>

<button 
onmousedown="startManual()" 
onmouseup="stopManual()"
ontouchstart="startManual()" 
ontouchend="stopManual()">
Servir comida (mantener)
</button>

</div>

<!-- 🧠 MODO INTELIGENTE -->
<div class="card">
<h2>🧠 Modo Inteligente</h2>

<label>Peso mascota</label>
<select id="peso"></select>

<label>Raciones</label>
<select id="raciones"></select>

<button onclick="modoInteligente()">Servir inteligente</button>

<p id="calc"></p>

</div>

<!-- ⏰ PROGRAMAR -->
<div class="card">
<h2>⏰ Programar comida</h2>
<input type="time" id="horaProg">
<button onclick="programar()">Guardar</button>
<p id="msg"></p>
</div>

<!-- 📷 CAMARA -->
<div class="card">
<h2>📷 Cámara</h2>
<button onclick="camara()">Ver cámara</button>
<div id="cam"></div>
</div>

<!-- 📡 ESTADO -->
<div class="card">
<h2>📡 Estado</h2>
<p id="estado" class="estado-wait">Esperando...</p>
</div>

</div>

<script>

// 🔥 CONFIG
let BASE = "http://192.168.0.25";
let CAM  = "http://192.168.0.24";

let activa = false;
let intervaloCam = null;
let manualInterval = null;

// 🔥 GENERAR OPCIONES (CORREGIDO)
window.onload = function(){

  let pesoSelect = document.getElementById("peso");
  let racionesSelect = document.getElementById("raciones");

  for(let i=1;i<=20;i++){
    pesoSelect.innerHTML += <option value="${i}">${i} kg</option>;
  }

  for(let i=1;i<=8;i++){
    racionesSelect.innerHTML += <option value="${i}">${i} ración(es)</option>;
  }

}

// ⏰ RELOJ
function actualizarHora(){
  let ahora = new Date();

  let h = ahora.getHours();
  let m = ahora.getMinutes();
  let s = ahora.getSeconds();

  let ampm = h >= 12 ? "PM" : "AM";

  h = h % 12;
  if(h == 0) h = 12;

  document.getElementById("hora").innerText =
    h + ":" +
    ("0"+m).slice(-2) + ":" +
    ("0"+s).slice(-2) + " " + ampm;
}

setInterval(actualizarHora,1000);
actualizarHora();

// 🎮 MANUAL
function startManual(){
  manualInterval = setInterval(()=>{
    fetch(BASE + "/servo");
  }, 300);
}

function stopManual(){
  clearInterval(manualInterval);
}

// 🧠 INTELIGENTE
function modoInteligente(){

  let peso = parseInt(document.getElementById("peso").value);
  let raciones = parseInt(document.getElementById("raciones").value);

  let gramosDia = peso * 30;
  let gramosPorRacion = gramosDia / raciones;

  let tiempo = gramosPorRacion / 50;

  document.getElementById("calc").innerText =
    "Por ración: " + gramosPorRacion.toFixed(0) + " g";

  fetch(BASE + "/smart?time=" + tiempo);
}

// 📷 CAMARA
function camara(){

  let div = document.getElementById("cam");

  if(!activa){

    div.innerHTML = '<img id="stream" width="100%">';
    activa = true;

    let img = document.getElementById("stream");

    intervaloCam = setInterval(()=>{
      img.src = CAM + "/?t=" + new Date().getTime();
    },300);

  }else{

    clearInterval(intervaloCam);
    div.innerHTML = "";
    activa = false;
  }
}

// ⏰ PROGRAMAR
function programar(){

  let hora = document.getElementById("horaProg").value;

  if(!hora){
    alert("Selecciona una hora");
    return;
  }

  fetch(BASE + "/sethora?hora=" + hora);

  document.getElementById("msg").innerText =
    "Programado a: " + hora;
}

// 📡 SENSOR
setInterval(()=>{

  fetch(BASE + "/")
  .then(r => r.text())
  .then(d => {

    let estado = document.getElementById("estado");

    if(d.trim()=="1"){
      estado.innerText = "🐱 Kitty detectada";
      estado.className = "estado-ok";
    }else{
      estado.innerText = "Esperando...";
      estado.className = "estado-wait";
    }

  })
  .catch(()=>{
    let estado = document.getElementById("estado");
    estado.innerText = "🔴 Sin conexión";
    estado.className = "estado-off";
  });

},1500);

</script>

</body>
</html>
