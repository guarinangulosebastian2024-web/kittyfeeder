<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KittyFeeder PRO</title>

<style>
body{
  background: #0f172a url('logo.png') center no-repeat;
  background-size: 400px;
  color:white;
  font-family: 'Segoe UI', sans-serif;
  text-align:center;
}

h1{
  font-size:28px;
  margin-top:10px;
}

.clock{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin:10px auto;
  width:250px;
  font-size:18px;
  border:2px solid #22c55e;
}

.section{
  background:#1e293b;
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  max-width:420px;
  box-shadow:0 0 15px #000;
}

button, select{
  width:85%;
  padding:12px;
  margin:8px;
  border:none;
  border-radius:10px;
  font-size:15px;
}

.blue{ background:#06b6d4; }
.green{ background:#22c55e; }
.red{ background:#ef4444; }
.yellow{ background:#facc15; color:black; }

.result{
  background:#020617;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  border:1px solid #22c55e;
}

#cam{
  width:90%;
  border-radius:10px;
  margin-top:10px;
}

.footer{
  margin-top:20px;
  font-size:13px;
  color:#ccc;
}
</style>

</head>

<body>

<h1>🤖 KittyFeeder PRO</h1>

<div class="clock" id="horaActual"></div>

<!-- MANUAL -->
<div class="section">
<h2>Modo Manual</h2>

<button class="blue"
onmousedown="servir()"
onmouseup="detener()">
MANTENER PARA SERVIR
</button>

</div>

<!-- INTELIGENTE -->
<div class="section">
<h2>Modo Inteligente</h2>

<button class="blue" onclick="inteligente()">SERVIR AUTOMÁTICO</button>

<select id="peso"></select>
<select id="comidas"></select>

<button class="yellow" onclick="guardarConfig()">Guardar configuración</button>

<div class="result" id="resultado"></div>

</div>

<!-- HORARIO -->
<div class="section">
<h2>Programar comida</h2>

<label>Horas AM</label>
<select id="horaAM"></select>

<label>Horas PM</label>
<select id="horaPM"></select>

<label>Minutos</label>
<select id="minuto"></select>

<button class="green" onclick="guardarHora()">Guardar horario</button>

<div class="result" id="horario"></div>

</div>

<!-- CAMARA -->
<div class="section">
<h2>Cámara</h2>

<div class="clock" id="horaCam"></div>

<button class="green" onclick="toggleCam()">Ver / Ocultar cámara</button>

<img id="cam" src="http://192.168.0.24" style="display:none;">

</div>

<div class="footer">
📞 Servicio: 3115405438  
📧 guarinangulosebastian2024@gmail.com  
⚙️ A.G Robotics
</div>

<script>

// 🔐 TOKEN BLYNK
var token = "rENj_cpRbyDzJjYU6ZxKDegh8J0xxbtP";

// ⏰ RELOJ
setInterval(function(){
  var now = new Date();
  var hora = now.toLocaleTimeString();
  document.getElementById("horaActual").innerHTML = hora;
  document.getElementById("horaCam").innerHTML = hora;
},1000);

// 📡 FUNCIÓN ENVIAR A BLYNK
function enviar(url){
  fetch(url)
  .then(r=>r.text())
  .then(d=>console.log("Respuesta:", d))
  .catch(e=>console.log("Error:", e));
}

// 🔵 MANUAL
function servir(){
  enviar("https://blynk.cloud/external/api/update?token="+token+"&V0=1");
}

function detener(){
  enviar("https://blynk.cloud/external/api/update?token="+token+"&V0=0");
}

// 🧠 INTELIGENTE
function inteligente(){
  enviar("https://blynk.cloud/external/api/update?token="+token+"&V2=1");
}

// 🍽 CONFIGURACIÓN COMIDA
function guardarConfig(){
  var peso = parseInt(document.getElementById("peso").value);
  var comidas = parseInt(document.getElementById("comidas").value);

  var gramosDia = peso * 40;
  var porcion = Math.round(gramosDia / comidas);

  document.getElementById("resultado").innerHTML =
  "🐾 Peso: "+peso+" kg<br>"+
  "🍽️ Comidas: "+comidas+"<br>"+
  "⚖️ Total día: "+gramosDia+" g<br>"+
  "➡️ Por comida: "+porcion+" g";

  enviar("https://blynk.cloud/external/api/update?token="+token+"&V10="+porcion);
}

// ⏰ 🔥 PROGRAMAR HORARIO (CORREGIDO)
function guardarHora(){

  var am = document.getElementById("horaAM").value;
  var pm = document.getElementById("horaPM").value;
  var m = document.getElementById("minuto").value;

  var horaAM = parseInt(am);
  var horaPM = parseInt(pm) + 12;
  var minuto = parseInt(m);

  // 🔥 ENVÍO REAL A BLYNK
  enviar("https://blynk.cloud/external/api/update?token="+token+"&V1="+horaAM);
  enviar("https://blynk.cloud/external/api/update?token="+token+"&V5="+minuto);

  document.getElementById("horario").innerHTML =
  "⏰ AM: "+horaAM+":"+minuto+" | PM: "+horaPM+":"+minuto;

  console.log("Hora enviada:", horaAM, "Minuto:", minuto);
}

// 📷 CÁMARA
function toggleCam(){
  var cam = document.getElementById("cam");

  if(cam.style.display === "none"){
    cam.style.display = "block";
  }else{
    cam.style.display = "none";
  }
}

// 🔧 GENERAR OPCIONES

for(var i=1;i<=15;i++){
  document.getElementById("peso").innerHTML += "<option value='"+i+"'>"+i+" kg</option>";
}

for(var i=1;i<=6;i++){
  document.getElementById("comidas").innerHTML += "<option value='"+i+"'>"+i+" comidas</option>";
}

for(var i=1;i<=12;i++){
  document.getElementById("horaAM").innerHTML += "<option value='"+i+"'>"+i+"</option>";
}

for(var i=1;i<=12;i++){
  document.getElementById("horaPM").innerHTML += "<option value='"+i+"'>"+i+"</option>";
}

for(var i=0;i<60;i++){
  var val = i<10 ? "0"+i : i;
  document.getElementById("minuto").innerHTML += "<option value='"+i+"'>"+val+"</option>";
}

</script>

</body>
</html>
