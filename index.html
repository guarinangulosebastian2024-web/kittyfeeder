<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* 🌌 FONDO ANIMADO */
body{
  font-family: Arial, sans-serif;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;

  background: linear-gradient(270deg, #0f172a, #020617, #1e293b);
  background-size: 600% 600%;
  animation: fondoAnimado 12s ease infinite;
}

@keyframes fondoAnimado{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* 📱 CONTENEDOR TIPO APP */
.app{
  width:100%;
  max-width:420px;
  padding:20px;
}

/* 🧊 TARJETAS GLASS */
.card{
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  border:1px solid rgba(255,255,255,0.1);
  margin:15px 0;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* TITULOS */
h1{
  text-align:center;
  margin-bottom:20px;
}

h2{
  margin-bottom:10px;
}

/* 🐱 MASCOTAS */
.mascotas{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:20px;
}

.mascotas img{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #22c55e;
  box-shadow:0 0 20px #22c55e;
  transition:0.3s;
}

.mascotas img:hover{
  transform:scale(1.1);
  box-shadow:0 0 30px #22c55e;
}

/* ✨ BOTONES FUTURISTAS */
button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 10px #22c55e;
}

button:hover{
  box-shadow:0 0 25px #22c55e;
  transform:translateY(-2px);
}

button:active{
  transform:scale(0.97);
}

/* INPUTS */
input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
  background:rgba(255,255,255,0.1);
  color:white;
}

/* CAMARA */
#cam img{
  width:100%;
  border-radius:15px;
  margin-top:10px;
}

/* ESTADOS */
.estado-ok{color:#22c55e;}
.estado-wait{color:#facc15;}
.estado-off{color:red;}

</style>
</head>

<body>

<div class="app">

<h1>🤖 A.G ROBOTICS</h1>

<div class="mascotas">
  <img src="kitty.png">
  <img src="fiona.png">
</div>

<div class="card">
  <h2>⏰ Hora</h2>
  <p id="hora"></p>
</div>

<div class="card">
  <h2>🎮 Manual</h2>
  <button id="btnManual">Servir comida</button>
</div>

<div class="card">
  <h2>🧠 Inteligente</h2>

  <select id="peso"></select>
  <select id="raciones"></select>

  <button id="btnSmart">Servir</button>
  <p id="calc"></p>
</div>

<div class="card">
  <h2>📷 Cámara</h2>
  <button id="btnCam">Ver</button>
  <div id="cam"></div>
</div>

<div class="card">
  <h2>📡 Estado</h2>
  <p id="estado" class="estado-wait">Esperando...</p>
</div>

</div>

<script>

// CONFIG
let BASE = "http://192.168.0.25";
let CAM  = "http://192.168.0.24";

let manualInterval;
let intervaloCam;
let activa = false;

// SELECTS
let pesoSelect = document.getElementById("peso");
for(let i=1;i<=20;i++){
  let o=document.createElement("option");
  o.value=i;
  o.text=i+" kg";
  pesoSelect.appendChild(o);
}

let racionesSelect = document.getElementById("raciones");
for(let i=1;i<=8;i++){
  let o=document.createElement("option");
  o.value=i;
  o.text=i+" ración(es)";
  racionesSelect.appendChild(o);
}

// RELOJ
function actualizarHora(){
  let el=document.getElementById("hora");
  let d=new Date();

  let h=d.getHours();
  let m=d.getMinutes();
  let s=d.getSeconds();

  let ampm=h>=12?"PM":"AM";
  h=h%12; if(h==0) h=12;

  el.innerText=
  h+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2)+" "+ampm;
}
setInterval(actualizarHora,1000);

// MANUAL
let btnManual=document.getElementById("btnManual");

btnManual.addEventListener("mousedown",()=>{
  manualInterval=setInterval(()=>fetch(BASE+"/servo"),300);
});
btnManual.addEventListener("mouseup",()=>clearInterval(manualInterval));

// INTELIGENTE
document.getElementById("btnSmart").onclick=()=>{

  let peso=parseInt(pesoSelect.value);
  let r=parseInt(racionesSelect.value);

  let g=(peso*30)/r;

  document.getElementById("calc").innerText=
  "Por ración: "+g.toFixed(0)+" g";

  fetch(BASE+"/smart?time="+(g/50));
};

// CAMARA
document.getElementById("btnCam").onclick=()=>{

  let div=document.getElementById("cam");

  if(!activa){
    div.innerHTML='<img id="stream">';
    activa=true;

    let img=document.getElementById("stream");

    intervaloCam=setInterval(()=>{
      img.src=CAM+"/?t="+Date.now();
    },300);

  }else{
    clearInterval(intervaloCam);
    div.innerHTML="";
    activa=false;
  }
};

// SENSOR
setInterval(()=>{
  fetch(BASE+"/")
  .then(r=>r.text())
  .then(d=>{
    let e=document.getElementById("estado");

    if(d.trim()=="1"){
      e.innerText="🐱 Detectado";
      e.className="estado-ok";
    }else{
      e.innerText="Esperando...";
      e.className="estado-wait";
    }
  })
  .catch(()=>{
    let e=document.getElementById("estado");
    e.innerText="🔴 Sin conexión";
    e.className="estado-off";
  });
},1500);

</script>

</body>
</html>
