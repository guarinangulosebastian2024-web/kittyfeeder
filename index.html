<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>
<link rel="icon" href="data:,">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

body{
  font-family: Arial, sans-serif;
  color:white;
  text-align:center;

  background: 
    linear-gradient(rgba(15,23,42,0.85), rgba(15,23,42,0.95)),
    url("logo.png");

  background-size: 400px;
  background-repeat: no-repeat;
  background-position: center;
  background-attachment: fixed;
}

.overlay{
  min-height:100vh;
  padding:20px;
}

h1{
  font-size:28px;
  margin-bottom:20px;
}

.card{
  background:rgba(30,41,59,0.9);
  margin:15px auto;
  padding:20px;
  border-radius:20px;
  width:95%;
  max-width:400px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(0.98);
}

input, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

.estado-ok{color:#22c55e;}
.estado-wait{color:#facc15;}
.estado-off{color:red;}

#cam img{
  width:100%;
  max-width:600px;
  height:auto;
  border-radius:15px;
  margin-top:10px;
}

/* 🐱 Mascotas */
.mascotas{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-bottom:20px;
}

.mascotas img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid #22c55e;
  box-shadow:0 0 15px rgba(34,197,94,0.5);
  transition:0.3s;
}

.mascotas img:hover{
  transform:scale(1.1);
}
</style>
</head>

<body>

<div class="overlay">

<h1>🤖 A.G ROBOTICS</h1>

<!-- ⏰ HORA -->
<div class="card">
  <h2>⏰ Hora en vivo</h2>
  <p id="hora"></p>
</div>

<!-- 🐱 Mascotas -->
<div class="mascotas">
  <img src="kitty.jpg" alt="Kitty">
  <img src="fiona.jpg" alt="Fiona">
</div>

<!-- 🎮 MANUAL -->
<div class="card">
<h2>🎮 Modo Manual</h2>
<button id="btnManual">Servir comida (mantener)</button>
</div>

<!-- 🧠 INTELIGENTE -->
<div class="card">
<h2>🧠 Modo Inteligente</h2>

<label>Peso mascota</label>
<select id="peso"></select>

<label>Raciones</label>
<select id="raciones"></select>

<button id="btnSmart">Servir inteligente</button>

<p id="calc"></p>

</div>

<!-- ⏰ PROGRAMAR -->
<div class="card">
<h2>⏰ Programar comida</h2>
<input type="time" id="horaProg">
<button id="btnProg">Guardar</button>
<p id="msg"></p>
</div>

<!-- 📷 CAMARA -->
<div class="card">
<h2>📷 Cámara</h2>
<button id="btnCam">Ver cámara</button>
<div id="cam"></div>
</div>

<!-- 📡 ESTADO -->
<div class="card">
<h2>📡 Estado</h2>
<p id="estado" class="estado-wait">Esperando...</p>
</div>

</div>

<script>

// CONFIG
let BASE = "http://192.168.0.25";
let CAM  = "http://192.168.0.24";

let manualInterval;
let intervaloCam;
let activa = false;

// SELECTS
let pesoSelect = document.getElementById("peso");
for(let i=1;i<=20;i++){
  let option = document.createElement("option");
  option.value = i;
  option.text = i + " kg";
  pesoSelect.appendChild(option);
}

let racionesSelect = document.getElementById("raciones");
for(let i=1;i<=8;i++){
  let option = document.createElement("option");
  option.value = i;
  option.text = i + " ración(es)";
  racionesSelect.appendChild(option);
}

// ⏰ RELOJ (CORREGIDO)
function actualizarHora(){
  let horaElemento = document.getElementById("hora");
  if(!horaElemento) return;

  let ahora = new Date();
  let h = ahora.getHours();
  let m = ahora.getMinutes();
  let s = ahora.getSeconds();

  let ampm = h>=12?"PM":"AM";
  h = h%12; if(h==0) h=12;

  horaElemento.innerText =
    h+":"+("0"+m).slice(-2)+":"+("0"+s).slice(-2)+" "+ampm;
}

setInterval(actualizarHora,1000);
actualizarHora();

// 🎮 MANUAL
let btnManual = document.getElementById("btnManual");

function iniciarServir(){
  fetch(BASE+"/servo");
  manualInterval = setInterval(()=>{
    fetch(BASE+"/servo");
  },300);
}

function detenerServir(){
  clearInterval(manualInterval);
}

btnManual.addEventListener("mousedown", iniciarServir);
btnManual.addEventListener("mouseup", detenerServir);
btnManual.addEventListener("mouseleave", detenerServir);

btnManual.addEventListener("touchstart", (e)=>{
  e.preventDefault();
  iniciarServir();
});
btnManual.addEventListener("touchend", detenerServir);

// 🧠 INTELIGENTE
document.getElementById("btnSmart").addEventListener("click", ()=>{

  let peso = parseInt(pesoSelect.value);
  let raciones = parseInt(racionesSelect.value);

  let gramosDia = peso * 30;
  let gramosPorRacion = gramosDia / raciones;
  let tiempo = gramosPorRacion / 50;

  document.getElementById("calc").innerText =
    "Por ración: " + gramosPorRacion.toFixed(0) + " g";

  fetch(BASE+"/smart?time="+tiempo);
});

// 📷 CAMARA
document.getElementById("btnCam").addEventListener("click", ()=>{

  let div = document.getElementById("cam");

  if(!activa){
    div.innerHTML = '<img id="stream">';
    activa = true;

    let img = document.getElementById("stream");

    intervaloCam = setInterval(()=>{
      img.src = CAM + "/?t=" + new Date().getTime();
    },300);

  }else{
    clearInterval(intervaloCam);
    div.innerHTML="";
    activa=false;
  }
});

// ⏰ PROGRAMAR
document.getElementById("btnProg").addEventListener("click", ()=>{

  let hora = document.getElementById("horaProg").value;

  if(!hora){
    alert("Selecciona una hora");
    return;
  }

  fetch(BASE+"/sethora?hora="+hora);
  document.getElementById("msg").innerText = "Programado a: "+hora;
});

// 📡 SENSOR
setInterval(()=>{

  fetch(BASE+"/")
  .then(r=>r.text())
  .then(d=>{

    let estado=document.getElementById("estado");

    if(d.trim()=="1"){
      estado.innerText="🐱 Kitty detectada";
      estado.className="estado-ok";
    }else{
      estado.innerText="Esperando...";
      estado.className="estado-wait";
    }

  })
  .catch(()=>{
    let estado=document.getElementById("estado");
    estado.innerText="🔴 Sin conexión";
    estado.className="estado-off";
  });

},1500);

</script>

</body>
</html>
