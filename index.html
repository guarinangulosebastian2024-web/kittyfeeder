<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Feeder PRO</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.card{
  background:#1e293b;
  margin:15px auto;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:400px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:white;
  font-weight:bold;
}

select,input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
}

.estado-ok{color:#22c55e;}
.estado-wait{color:#facc15;}
.estado-off{color:red;}
</style>
</head>

<body>

<h1>🤖 A.G ROBOTICS</h1>

<!-- ESTADO -->
<div class="card">
<h2>Estado</h2>
<p id="estado" class="estado-wait">Esperando...</p>
</div>

<!-- MANUAL -->
<div class="card">
<h2>Manual</h2>
<button id="btnManual">Mantener para servir</button>
</div>

<!-- INTELIGENTE -->
<div class="card">
<h2>Modo Inteligente</h2>

<select id="peso"></select>
<select id="raciones"></select>

<button onclick="guardarInteligente()">Guardar</button>

<p id="info"></p>
</div>

<!-- PROGRAMAR -->
<div class="card">
<h2>Programar comida</h2>

<input type="time" id="hora">

<button onclick="guardarHora()">Guardar horario</button>

<p id="proxima">--:--</p>
</div>

<!-- CAMARA -->
<div class="card">
<h2>Cámara</h2>
<button onclick="toggleCam()">Ver cámara</button>
<div id="cam"></div>
</div>

<script>

// 🔥 CONFIG FIREBASE
const firebaseConfig = {
  databaseURL: "https://smart-feeder-kitty-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 🔥 SELECTS
for(let i=1;i<=15;i++){
  peso.innerHTML += <option value="${i}">${i} kg</option>;
}

for(let i=1;i<=8;i++){
  raciones.innerHTML += <option value="${i}">${i} comida(s)</option>;
}

// 🔥 MANUAL (MANTENER PRESIONADO)
let btn = document.getElementById("btnManual");

btn.onmousedown = () => db.ref("manual").set(1);
btn.onmouseup = () => db.ref("manual").set(0);
btn.onmouseleave = () => db.ref("manual").set(0);

// 🔥 MODO INTELIGENTE
function guardarInteligente(){

  let p = parseInt(peso.value);
  let r = parseInt(raciones.value);

  let gramosDia = p * 30;
  let porcion = gramosDia / r;

  let tiempo = porcion / 50;

  document.getElementById("info").innerText =
  "Por comida: " + porcion.toFixed(0) + " g";

  db.ref("modo").set("inteligente");
  db.ref("tiempo").set(tiempo);
}

// 🔥 PROGRAMAR
function guardarHora(){
  let h = document.getElementById("hora").value;

  if(!h){
    alert("Selecciona hora");
    return;
  }

  db.ref("hora").set(h);
  document.getElementById("proxima").innerText = "Próxima: " + h;
}

// 🔥 SENSOR TIEMPO REAL
db.ref("sensor").on("value", snap=>{
  let estado = document.getElementById("estado");

  if(snap.val() == 1){
    estado.innerText = "🐱 Kitty detectada";
    estado.className = "estado-ok";
  }else{
    estado.innerText = "Esperando...";
    estado.className = "estado-wait";
  }
});

// 🔥 CAMARA
let activa=false;
let intervalo;

function toggleCam(){
  let div = document.getElementById("cam");

  if(!activa){
    div.innerHTML = '<img id="img" width="100%">';
    let img = document.getElementById("img");

    intervalo = setInterval(()=>{
      img.src = "http://192.168.0.21/?t=" + new Date().getTime();
    }, 500);

    activa = true;
  }else{
    clearInterval(intervalo);
    div.innerHTML = "";
    activa = false;
  }
}

</script>

</body>
</html>
